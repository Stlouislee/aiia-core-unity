name: C# Syntax Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Tests~/A2A.Tests/A2A.Tests.csproj

      - name: Build
        run: dotnet build Tests~/A2A.Tests/A2A.Tests.csproj --no-restore --verbosity minimal

      - name: Run tests
        run: dotnet test Tests~/A2A.Tests/A2A.Tests.csproj --no-build --verbosity minimal
